# Reject packages published less than 7 days ago (supply chain protection)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@hyperlane-xyz/*'
overrides:
  # Midnight: @hyperlane-xyz/utils 33.0.2 + ProtocolType.Midnight and its
  # address codecs, built from equilibriumco/hyperlane-monorepo branch
  # midnight-utils-33.0.2 (based on the upstream 33.0.2 release commit
  # 4815a47cc). utils resolves exactly once in this dependency graph, so the
  # override propagates into sdk/widgets, and the SDK's forwardCompatibleEnum
  # reads the enum at runtime - `protocol: 'midnight'` survives metadata
  # validation without an sdk override.
  '@hyperlane-xyz/utils': file:vendor/hyperlane-xyz-utils-33.0.2-midnight.tgz
  tronweb>ethers: ^6.13.5
  ethers: ^5.7
  sha.js: 2.4.12
  cipher-base: 1.0.5
  elliptic: 6.6.1
  pbkdf2: 3.1.3
  form-data: 4.0.4
enablePrePostScripts: true
allowBuilds:
  '@parcel/watcher': false
  bigint-buffer: false
  bufferutil: false
  core-js: false
  esbuild: false
  keccak: false
  protobufjs: false
  secp256k1: false
  sharp: false
  tiny-secp256k1: false
  utf-8-validate: false
