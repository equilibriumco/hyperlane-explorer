# Reject packages published less than 7 days ago (supply chain protection)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@hyperlane-xyz/*'
overrides:
  # Cardano + Midnight: @hyperlane-xyz/utils 36.0.0 + both ProtocolTypes and
  # their address codecs. utils resolves exactly once in this dependency graph,
  # so the override propagates into sdk/widgets, and the SDK's
  # forwardCompatibleEnum reads the enum at runtime - `protocol: 'cardano'` and
  # `'midnight'` survive metadata validation without an sdk override. The
  # vendored tarball is built from equilibriumco/hyperlane-monorepo branch
  # midnight-cardano, whose utils differs from that branch's upstream base by
  # exactly the cardano and midnight protocol commits. All of this disappears
  # once upstream ships them.
  '@hyperlane-xyz/utils': file:vendor/hyperlane-xyz-utils-36.0.0-cardano-midnight.tgz
  # Overriding utils re-resolves its subtree (@solana/web3.js -> rpc-websockets
  # -> uuid), which pulls the ESM-only uuid v14 that Jest cannot parse. Pin it
  # to what the lockfile resolved before. Goes away with the override above.
  'rpc-websockets>uuid': 8.3.2
  tronweb>ethers: ^6.13.5
  ethers: ^5.7
  sha.js: 2.4.12
  cipher-base: 1.0.5
  elliptic: 6.6.1
  pbkdf2: 3.1.3
  form-data: 4.0.4
enablePrePostScripts: true
allowBuilds:
  '@parcel/watcher': false
  bigint-buffer: false
  bufferutil: false
  core-js: false
  esbuild: false
  keccak: false
  protobufjs: false
  secp256k1: false
  sharp: false
  tiny-secp256k1: false
  utf-8-validate: false
